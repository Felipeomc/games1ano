<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos de Robótica · 1º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canopy-deep:#123321;
  --canopy:#1c4d31;
  --forest-mid:#2f6b42;
  --forest-light:#5fa06b;
  --earth:#6b4326;
  --earth-light:#8a5c37;
  --panel:#fbf3df;
  --panel-edge:#c9a35c;
  --ink:#2a2016;
  --ink-soft:#5c5142;
  --accent:#e0803a;
  --accent-dark:#a4531c;
  --ok:#3f9457;
  --locked:#9aa89e;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--canopy-deep); color:var(--ink);
  font-family:'Baloo 2','Segoe UI Rounded',system-ui,sans-serif;
  min-height:100%;
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(95,160,107,.35), transparent),
    radial-gradient(ellipse 900px 600px at 85% 110%, rgba(18,51,33,.9), transparent);
  padding: 40px 20px 60px;
}
.wrap{max-width:920px; margin:0 auto;}
header{text-align:center; margin-bottom:36px;}
h1{
  margin:0 0 6px; font-size:clamp(30px,6vw,48px); color:#f6c445;
  text-shadow:0 4px 0 rgba(0,0,0,.25); text-wrap:balance;
}
header p{margin:0; color:#cfe0d2; font-weight:600; font-size:15px; letter-spacing:.3px;}

.grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}
.card{
  background:var(--panel); border:4px solid var(--panel-edge); border-radius:20px;
  padding:22px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; gap:10px;
  box-shadow:0 8px 0 rgba(0,0,0,.22); transition:transform .12s ease;
}
.card:hover{transform:translateY(-3px);}
.card .emoji{font-size:40px; line-height:1;}
.card h2{margin:0; font-size:22px; color:var(--accent-dark);}
.card p{margin:0; font-size:14px; color:var(--ink-soft); font-weight:600; line-height:1.4;}
.card .tag{
  margin-top:auto; align-self:flex-start; font-size:12px; font-weight:800; letter-spacing:.4px;
  background:var(--ok); color:#fff; padding:5px 12px; border-radius:999px;
}
.card.locked{opacity:.62; cursor:default; pointer-events:none;}
.card.locked .tag{background:var(--locked);}

footer{text-align:center; margin-top:44px; color:#9db79f; font-size:13px; font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤖 Jogos de Robótica</h1>
    <p>1º ANO · ESCOLA SONHO DE CRIANÇA · 2026</p>
  </header>

  <div class="grid">
    <a class="card" href="tocandira.html">
      <span class="emoji">🐜</span>
      <h2>Tocandira</h2>
      <p>Atravesse a floresta e escape da formiga usando o mesmo truque do sensor do robô.</p>
      <span class="tag">JOGAR</span>
    </a>

    <div class="card locked">
      <span class="emoji">🐊</span>
      <h2>Robô Jacaré</h2>
      <p>Em breve.</p>
      <span class="tag">EM BREVE</span>
    </div>

    <div class="card locked">
      <span class="emoji">💡</span>
      <h2>Light Bot</h2>
      <p>Em breve.</p>
      <span class="tag">EM BREVE</span>
    </div>
  </div>

  <footer>robótica lúdica · feito para as aulas do 1º ano</footer>
</div>
</body>
</html>
